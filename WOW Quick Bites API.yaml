      summary: Replace the business settings
      tags:
      - Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BusinessRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BusinessRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: unauthenticated / invalid_credentials
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: forbidden / account_suspended / not_assigned / staff_password_only
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: validation_failed
    patch:
      operationId: admin_business_partial_update
      summary: Update some business settings
      tags:
      - Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBusinessRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBusinessRequest'
          application/x-www-form-urlencoded:
