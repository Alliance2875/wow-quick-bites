openapi: 3.0.3
info:
  title: WOW Quick Bites API
  version: 2.0.0
  description: 'API of the WOW Quick Bites website: catalogue, orders, client area
    and staff portal. JSON keys are camelCase. Errors: `{ "error": { "code", "message",
    "details" } }`. Authenticate with `Authorization: Bearer <access token>` from
    `POST /api/v1/auth/sign-in`.'
paths:
  /api/v1/admin/audit/:
    get:
      operationId: admin_audit_retrieve
      summary: Audit trail, newest first
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: '`nextCursor` of the previous page'
      - in: query
        name: limit
        schema:
          type: integer
        description: 1–100, default 20
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - access
          - content
          - orders
      tags:
      - Staff
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: unauthenticated / invalid_credentials
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: forbidden / account_suspended / not_assigned / staff_password_only
  /api/v1/admin/business/:
    get:
      operationId: admin_business_retrieve
      summary: Business settings (portal)
      tags:
      - Content
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
