components:
  schemas:
    AdminMenuItem:
      type: object
      description: 'An item in the portal: the live values, its state and the pending
        changes.'
      properties:
        id:
          type: string
        name:
          type: object
          properties:
            en:
              type: string
            fr:
              type: string
          required:
          - en
          - fr
        description:
          type: object
          properties:
            en:
              type: string
            fr:
              type: string
          required:
          - en
          - fr
        cartMeta:
          type: object
          properties:
            en:
              type: string
            fr:
              type: string
          required:
          - en
          - fr
          nullable: true
        price:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: RWF
        image:
          type: string
          description: Absolute URL, or a path served by the website.
          maxLength: 500
        group:
          $ref: '#/components/schemas/GroupEnum'
        section:
          type: string
          readOnly: true
        categories:
          type: array
          items:
            type: string
          readOnly: true
        tags:
          type: array
          items:
            type: string
          readOnly: true
        isNew:
          type: boolean
        available:
          type: boolean
        optionGroups:
          type: array
          items:
            type: string
          readOnly: true
        pairsWith:
          type: string
          readOnly: true
        state:
          type: string
          readOnly: true
        draft:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        deleted:
          type: boolean
          readOnly: true
      required:
      - available
      - categories
      - deleted
      - description
      - draft
      - id
      - name
      - optionGroups
      - pairsWith
      - price
      - section
      - state
      - tags
      - updatedAt
    AssignRequest:
      type: object
      properties:
        managerId:
          type: string
          minLength: 1
          description: Staff id of the manager.
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - managerId
    AssignmentEnum:
      enum:
      - pickup-register
      - backup
      - none
      type: string
      description: |-
        * `pickup-register` - Pickup register
        * `backup` - Backup
        * `none` - None
    AuditEvent:
      type: object
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        actorId:
          type: string
          readOnly: true
          description: Staff id, or "system".
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        targetId:
          type: string
          nullable: true
          readOnly: true
        type:
          type: string
          maxLength: 40
        data: {}
        text:
          type: object
          properties:
            en:
              type: string
            fr:
              type: string
          required:
          - en
          - fr
      required:
      - actorId
      - at
      - id
      - scope
      - targetId
      - text
      - type
    AuditPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          type: string
          nullable: true
      required:
      - items
      - nextCursor
    Auth:
      type: object
      description: Response of every successful sign-in.
      properties:
        access:
          type: string
          description: 'Access token, send it as `Authorization: Bearer <access>`.'
        refresh:
          type: string
          description: Refresh token, exchange it at POST /auth/refresh.
        user:
          $ref: '#/components/schemas/SessionUser'
